[project]
name = "dbxj"
dynamic = ["version"]
description = "A keyboard-driven terminal UI for browsing Databricks jobs, runs and task logs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Travis Dent" }]
keywords = ["databricks", "tui", "textual", "jobs", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "databricks-sdk>=0.49.0",
    "textual>=3.0.0,<9",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "pre-commit>=4.1.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.4",
    "textual-dev>=1.7.0",
    "ty==0.0.99",
]

[project.urls]
Homepage = "https://github.com/pugillum/dbxj"
Issues = "https://github.com/pugillum/dbxj/issues"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[project.scripts]
dbxj = "dbxj.main:main"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.uv]
exclude-newer = "7 days"

[tool.ty.src]
exclude = ["scripts"]
